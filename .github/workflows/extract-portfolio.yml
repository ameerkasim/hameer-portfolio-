name: Extract portfolio ZIP and publish files

on:
  push:
    paths:
      - "portfolio.zip"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract portfolio
        run: |
          test -f portfolio.zip
          mkdir -p /tmp/portfolio
          unzip -q portfolio.zip -d /tmp/portfolio
          ROOT="$(find /tmp/portfolio -name index.html -type f -printf '%h\n' | head -n 1)"
          test -n "$ROOT"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name portfolio.zip -exec rm -rf {} +
          cp -a "$ROOT"/. .
          rm -f portfolio.zip

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish cinematic portfolio website" || echo "No changes to commit"
          git push